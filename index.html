<html lang="pt-BR"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1740;--mut:#6B6890;--ln:#ECE9F7;--pu:#6D4AE0;--pud:#4B2FB8;--pul:#F0EDFA;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:#3B2396 linear-gradient(170deg,#7550F0 0%,#4B2FB8 55%,#3B2396 100%) fixed;color:var(--ink);font:16px/1.4 'Manrope',system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #FFB020;outline-offset:2px}
.hd{padding:calc(12px + env(safe-area-inset-top,0px)) 18px 22px;display:flex;flex-direction:column;gap:12px;color:#fff}
.stl{font-size:12px;font-weight:600;color:#D3C9FF;min-height:16px}
.hn{display:flex;align-items:center;justify-content:space-between;gap:8px}.hn b{flex:1;text-align:center;font-size:15px;font-weight:700}
.rb{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.hl{font-size:14px;font-weight:600;color:#D3C9FF;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hb{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hoje{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-weight:700;font-size:13px}
.cards{display:flex;gap:12px}.cd{flex:1;min-width:0;background:rgba(24,10,80,.38);border-radius:18px;padding:14px 16px}
.hl2{font-size:13px;font-weight:600;color:#D3C9FF}.cv{font-size:24px;font-weight:800;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:rgba(24,10,80,.38);overflow:hidden}.bar i{display:block;height:8px;border-radius:4px;background:#6EE7B7}
.bl{margin-top:8px;font-size:12.5px;font-weight:600;color:#D3C9FF}
.sheet{flex:1;background:#fff;border-radius:32px 32px 0 0;padding:18px 18px 0;display:flex;flex-direction:column}
#sheetin{flex:1;padding-bottom:16px}
.bn{position:sticky;bottom:0;background:#fff;margin:0 -18px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;border-top:1px solid var(--ln)}

.chip span{display:block;font-size:16px;font-weight:800}.chip.sel{background:var(--pud);color:#fff}.chip.td{border-color:var(--pu)}
.list{display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:10px;min-height:50px}

.tile.free{border:2px dashed #BDB4E6;color:var(--mut)}
.tx{flex:1;min-width:0}.nm{font-weight:700;font-size:15px;overflow-wrap:anywhere}.sb{font-size:12.5px;font-weight:600;color:var(--mut)}
.pill{min-height:44px;padding:0 12px;border:0;border-radius:22px;background:var(--pul);color:var(--pud);font-weight:700;font-size:13px;white-space:nowrap}.pill.ol{background:#fff;border:1.5px solid var(--pu)}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:var(--pul);color:var(--pud);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.cb{width:44px;height:44px;border-radius:22px;border:2px solid var(--pu);background:#fff;color:var(--pu);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.cb.on{background:#1FA37A;border-color:#1FA37A;color:#fff}
.lk{min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--pud);font-weight:700;font-size:13px}
.panel{background:#F7F5FD;border-radius:16px;padding:12px;margin:4px 0;display:flex;flex-direction:column;gap:8px}
.ptit{font-weight:700;font-size:14px}.prow{display:flex;gap:8px;flex-wrap:wrap}.prow>*{flex:1;min-width:0}
input,select{width:100%;min-height:44px;background:#fff;border:1.5px solid #DDD8F0;border-radius:12px;padding:8px 10px;font:inherit;color:var(--ink)}
.pri{min-height:44px;border:0;border-radius:14px;background:var(--pud);color:#fff;font-weight:700;padding:0 14px}
.ghost{min-height:44px;border:1.5px solid #CFC9E8;border-radius:14px;background:#fff;color:var(--pud);font-weight:700;padding:0 14px}.ghost.danger{color:#B3411F;border-color:#F2BFB0}.wide{width:100%}
.hint{color:var(--mut);font-size:13px;margin:8px 0}
.mrow{display:flex;gap:8px;align-items:center}.mrow input.t{width:136px;flex:none;padding:8px 6px}.mrow input[data-m]{flex:1;min-width:0}
.stu{background:#F7F5FD;border-radius:16px;padding:8px 12px}.dt{font-size:12.5px;color:var(--mut);margin:2px 0 4px 54px}
.in{color:#0B7A57}.out{color:#B3411F}
.seg{display:flex;gap:4px;background:var(--pul);border-radius:18px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:14px;background:transparent;color:var(--mut);font-weight:800;font-size:14px}
.seg button.on{background:#fff;color:var(--pud);box-shadow:0 1px 4px rgba(27,23,64,.18)}
.rw{border-radius:16px;padding:2px 6px}.rw.paid{background:#EAF8F2}
.lft{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;color:inherit;min-height:48px}
.am{font-weight:800;font-size:15px;white-space:nowrap}.am.in{color:#0B7A57}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fl small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}
.card{background:#F7F5FD;border-radius:16px;padding:12px;margin-top:14px}.card small{color:var(--mut);font-size:13px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div id="authbar" style="max-width:560px;margin:0 auto;padding:14px 14px 0"></div><div id="app"></div>
<script>
const DN=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],HS=[];for(let h=5;h<=23;h++)HS.push(h);
let S={matrix:{},weeks:{},log:{},fin:[],times:{},al:{},dfix:[],paid:{}};
try{const r=localStorage.getItem('agfin');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const cs=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).sort(([a],[b])=>a<b?-1:a>b?1:0)):x);
const DBG={db:null,ready:false,last:{},q:Promise.resolve(),timer:null,st:'local'};
const ST={local:'Salvo só neste aparelho',sync:'Sincronizado na sua conta',busy:'Salvando…',err:'Erro ao sincronizar. Recarregue a página.',login:'Entre com o Google para sincronizar (por enquanto salvo só neste aparelho)',nocfg:'Firebase ainda não configurado. Salvo só neste aparelho.',cfgerr:'Erro no firebase-config.js: confira aspas e vírgulas. Salvo só neste aparelho.'};
function setSt(x){DBG.st=x;const e=document.getElementById('st');if(e)e.textContent=ST[x]}
const save=()=>{try{localStorage.setItem('agfin',JSON.stringify(S))}catch(e){}clearTimeout(DBG.timer);DBG.timer=setTimeout(flush,500)};
function docsOf(){const o={};o['app/core']={matrix:S.matrix,times:S.times,al:S.al,dfix:S.dfix,paid:S.paid};
 for(const k in S.weeks)o['weeks/'+k]=S.weeks[k];
 const lm={};for(const k in S.log){const m=k.slice(0,7);(lm[m]=lm[m]||{})[k]=S.log[k]}
 for(const m in lm)o['logs/'+m]=lm[m];
 for(const q in DBG.last)if(q.startsWith('logs/')&&!o[q])o[q]={};
 return o}
function flush(){if(!DBG.db||!DBG.ready)return;const d=docsOf(),jobs=[];for(const q in d){const j=cs(d[q]);if(DBG.last[q]!==j)jobs.push([q,j])}
 if(!jobs.length)return;setSt('busy');
 DBG.q=DBG.q.then(async()=>{try{for(const [q,j] of jobs){await DBG.db.doc(q).set({j});DBG.last[q]=j}setSt('sync')}catch(e){setSt('err')}})}
const pj=x=>{try{return JSON.parse(x)}catch(e){return null}};
const hasData=(c,nl)=>Object.keys(c.matrix||{}).length||Object.keys(c.al||{}).length||(c.dfix||[]).length||Object.keys(c.paid||{}).length||Object.keys(c.times||{}).length||nl>0;
function syncLast(){const d=docsOf();for(const q in d)DBG.last[q]=cs(d[q])}
function applyCore(o){S.matrix=o.matrix||{};S.times=o.times||{};S.al=o.al||{};S.dfix=o.dfix||[];S.paid=o.paid||{}}
function applyLogMonth(id,o){for(const k in S.log)if(k.startsWith(id))delete S.log[k];Object.assign(S.log,o||{})}
function rerender(){const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;render()}
async function initDb(db){
 if(!db)return;DBG.db=db;
 try{
  const [c,ws,ls]=await Promise.all([db.doc('app/core').get(),db.collection('weeks').get(),db.collection('logs').get()]);
  const rc=c.exists?(pj(c.data().j)||{}):{},rl={};let n=0;
  ls.docs.forEach(d=>{const o=pj(d.data().j)||{};rl[d.id]=o;n+=Object.keys(o).length});
  const remoteHas=hasData(rc,n),localHas=hasData(S,Object.keys(S.log).length);
  if(remoteHas){
   applyCore(rc);S.log={};for(const m in rl)Object.assign(S.log,rl[m]);
   S.weeks={};ws.docs.forEach(d=>{const o=pj(d.data().j);if(o)S.weeks[d.id]=o});
   try{localStorage.setItem('agfin',JSON.stringify(S))}catch(e){}
   syncLast();ls.docs.forEach(d=>{const q='logs/'+d.id;if(!(q in DBG.last))DBG.last[q]=cs({})});
   rerender();
  }
  DBG.ready=true;
  if(!remoteHas&&localHas)flush();else setSt('sync');
  db.doc('app/core').onSnapshot(sn=>{if(!sn.exists||sn.metadata.hasPendingWrites)return;const o=pj(sn.data().j);if(!o||cs(o)===DBG.last['app/core'])return;applyCore(o);DBG.last['app/core']=cs(docsOf()['app/core']);rerender()},()=>{});
  db.collection('weeks').onSnapshot(qs=>{let ch=0;qs.docChanges().forEach(c2=>{if(c2.type==='removed'||c2.doc.metadata.hasPendingWrites)return;const o=pj(c2.doc.data().j),q='weeks/'+c2.doc.id;if(!o||cs(o)===DBG.last[q])return;S.weeks[c2.doc.id]=o;DBG.last[q]=cs(o);ch=1});if(ch)rerender()},()=>{});
  db.collection('logs').onSnapshot(qs=>{let ch=0;qs.docChanges().forEach(c2=>{if(c2.type==='removed'||c2.doc.metadata.hasPendingWrites)return;const o=pj(c2.doc.data().j),q='logs/'+c2.doc.id;if(!o||cs(o)===DBG.last[q])return;applyLogMonth(c2.doc.id,o);DBG.last[q]=cs(o);ch=1});if(ch)rerender()},()=>{});
 }catch(e){setSt('err')}
}
const p2=n=>String(n).padStart(2,'0'),dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const mon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ym0=dk(new Date()).slice(0,7),tdx=(new Date().getDay()+6)%7;
const shiftM=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1);return dk(d).slice(0,7)};
const mlabel=ym=>new Date(+ym.slice(0,4),+ym.slice(5)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
let V={tab:'ag',sub:'sem',wk:mon(new Date()),day:tdx,mday:0,rk:null,fk:null,mk:null,fs:'r',fe:null,am:ym0,fm:ym0};
const wdataW=w=>{const k=dk(w);if(!S.weeks[k]){const o={};for(let d=0;d<7;d++){const T=dtimes(d);HS.forEach(h=>{const n=S.matrix[d+'|'+h],kk=dk(addD(w,d))+'|'+h;if(n)o[kk]=n;o['t'+kk]=T[h]})}S.weeks[k]=o;save()}return S.weeks[k]},wdata=()=>wdataW(V.wk);
const fmt=m=>p2(Math.floor(m/60)%24)+':'+p2(m%60),tmin=s=>+s.slice(0,2)*60+ +s.slice(3,5);
function dtimes(d){const r={};let p=null;HS.forEach(h=>{const o=S.times[d+'|'+h],m=o?tmin(o):(p===null?h*60:p+60);r[h]=fmt(m);p=m});return r}
const students=()=>{const s=new Set(Object.values(S.matrix));Object.values(S.log).forEach(l=>s.add(l.name));return [...s].sort()};
const svg=(d,s=22,w=2.2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const P={ck:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',warn:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>',cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',chart:'<path d="M6 20V11M12 20V5M18 20v-6"/>',wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16.5" height="11.5" rx="3"/><path d="M16 13.5h.01"/>',swap:'<path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/>',rep:'<path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/>'};
const PAL=['#6D4AE0','#C27803','#E4572E','#1FA37A','#3B6FD4','#A24BC4'],tcol=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]},ini=n=>String(n).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(),cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const FULLDN=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];
const btn=(a,t,x='',c='')=>`<button class="${c}" data-a="${a}" ${x}>${t}</button>`;
const nav=(a,l)=>`<div class="hn">${btn(a,svg(P.l,20,2.4),'data-n="-1" aria-label="Anterior"','rb')}<b>${l}</b>${btn(a,svg(P.r,20,2.4),'data-n="1" aria-label="Próximo"','rb')}</div>`;
const chips=(sel,a)=>`<div class="days">${DN.map((n,i)=>{const d=addD(V.wk,i);return `<button class="chip ${i===sel?'sel':''} ${dk(d)===dk(new Date())?'td':''}" data-a="${a}" data-n="${i}">${n}<span>${d.getDate()}</span></button>`}).join('')}</div>`;
const bar=(pct,label,idb,idl)=>`<div><div class="bar"><i ${idb?`id="${idb}" `:''}style="width:${pct}%"></i></div><div class="bl" ${idl?`id="${idl}"`:''}>${label}</div></div>`;
const hdr=(top,label,big,cards,barH)=>`<div class="hd"><div class="stl" id="st"></div>${top}<div><div class="hl">${label}</div><div class="hb">${big}</div></div>${cards?`<div class="cards">${cards.map(c=>`<div class="cd"><div class="hl2">${c[0]}</div><div class="cv" ${c[3]?`id="${c[3]}" `:''}style="color:${c[2]}">${c[1]}</div></div>`).join('')}</div>`:''}${barH||''}</div>`;
function slot(d,h){const k=dk(d)+'|'+h,w=wdata(),base=w[k]||'',l=S.log[k],t=w['t'+k]||p2(h)+':00';
 const row=(bg,ic,nm,sb,sc,acts)=>`<div class="it"><div class="tile" style="background:${bg}">${ic}</div><div class="tx"><div class="nm">${esc(nm)}</div><div class="sb" style="color:${sc}">${t} · ${sb}</div></div>${acts}</div>`;
 const undo=btn('undo','Desfazer',`data-k="${k}"`,'lk');
 if(V.rk===k)return `<div class="panel"><div class="ptit">Reposição às ${t}</div><input id="rn" list="al" placeholder="Nome do aluno" autofocus><datalist id="al">${students().map(s=>`<option value="${esc(s)}">`).join('')}</datalist><div class="prow">${btn('saverep','Salvar reposição',`data-k="${k}"`,'pri')}${btn('cancel','Cancelar','','ghost')}</div></div>`;
 if(l&&l.type==='rep')return row('#3B6FD4',svg(P.rep),l.name,'Reposição','#1E4FB0',undo);
 if(l&&l.type==='done')return row('#1FA37A',svg(P.ck,22,2.4),l.name,'Realizada','#0B7A57',undo);
 if(l)return l.type==='fcom'?row('#C27803',svg(P.warn),l.name,'Falta com aviso','#8A5A00',undo):row('#E4572E',svg(P.x,22,2.4),l.name,l.type==='fsem'?'Falta sem aviso':'Faltou','#B3411F',undo);
 if(base&&V.mk===k)return `<div class="panel"><div class="ptit">Mover aula de ${esc(base)}</div><div class="prow"><input id="md" type="date" value="${dk(d)}"><input id="mt" type="time" value="${t}" style="max-width:130px"></div><div class="prow">${btn('domove','Mover aula',`data-k="${k}"`,'pri')}${btn('cancel','Cancelar','','ghost')}</div></div>`;
 if(base&&V.fk===k)return `<div class="panel"><div class="ptit">${esc(base)} · ${t}</div><div class="prow">${btn('fcom','Com aviso',`data-k="${k}"`,'ghost')}${btn('fsem','Sem aviso',`data-k="${k}"`,'ghost')}${btn('cancel','Cancelar','','ghost')}</div></div>`;
 if(base)return row('#6D4AE0',svg(P.clock),base,'Agendada','#6B6890',btn('mk',svg(P.swap,20),`data-k="${k}" aria-label="Mover aula" title="Mover aula"`,'ib')+btn('falta','Faltou',`data-k="${k}"`,'pill')+btn('done',svg(P.ck,20,2.6),`data-k="${k}" aria-label="Marcar como realizada"`,'cb'));
 return `<div class="it"><div class="tile free">${svg(P.plus,20,2.4)}</div><div class="tx"><div class="nm" style="color:#6B6890">Horário livre</div><div class="sb">${t}</div></div>${btn('rep','+ Reposição',`data-k="${k}"`,'pill ol')}</div>`}
function semana(){const a=V.wk,b=addD(a,6),f=d=>d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}),dd0=addD(V.wk,V.day),w0=wdata(),ds0=dk(dd0),ord=[...HS].sort((x,y)=>tmin(w0['t'+ds0+'|'+x]||p2(x)+':00')-tmin(w0['t'+ds0+'|'+y]||p2(y)+':00'));
 let tot=0,dn=0,ms=0;HS.forEach(h=>{const k=ds0+'|'+h,l=S.log[k];if(w0[k]||(l&&l.type==='rep'))tot++;if(l){if(l.type==='done'||l.type==='rep')dn++;else ms++}});
 const lab=cap(dd0.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})),isT=ds0===dk(new Date()),pct=tot?Math.round(dn/tot*100):0;
