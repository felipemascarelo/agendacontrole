<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda e Finanças</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1D4ED8"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Agenda">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--sf:#fff;--ink:#14171C;--mut:#69717F;--ln:#E2E5EA;--ac:#1D4ED8;--acs:#E5ECFF;--bad:#C62F1F;--bads:#FDE8E5;--ok:#15803D;--oks:#E0F4E7;--wn:#B45309;--wns:#FDF1DC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1115;--sf:#171B21;--ink:#EEF0F3;--mut:#9099A6;--ln:#2A3039;--ac:#7BA0FF;--acs:#1B2A52;--bad:#FF8A7A;--bads:#3A1F1B;--ok:#6FD39A;--oks:#14301F;--wn:#F2B35E;--wns:#3A2A10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1115;--sf:#171B21;--ink:#EEF0F3;--mut:#9099A6;--ln:#2A3039;--ac:#7BA0FF;--acs:#1B2A52;--bad:#FF8A7A;--bads:#3A1F1B;--ok:#6FD39A;--oks:#14301F;--wn:#F2B35E;--wns:#3A2A10;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 'Bricolage Grotesque',system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:26px;font-weight:800;margin:6px 0 12px;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
button{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:4px;background:var(--ln);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;font-weight:600;padding:10px}
.tabs button.on{background:var(--sf);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sub{display:flex;gap:8px;margin-bottom:12px}
.sub button{border-radius:99px;font-weight:600}
.sub button.on,.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav b{font-size:18px;text-transform:capitalize;text-align:center;flex:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.chip{padding:8px 0;text-align:center;border-radius:12px;font-size:12px;line-height:1.2}
.chip span{display:block;font-size:17px;font-weight:800}
.chip.td{border-color:var(--ac)}
.row{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin-bottom:6px;min-height:50px}
.row time{width:44px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.row .n{flex:1;min-width:0;overflow-wrap:anywhere}
.row.free .n{color:var(--mut)}
.row.f{background:var(--bads)}.row.r{background:var(--oks)}.row.w{background:var(--wns)}.row{flex-wrap:wrap}.tg.wn{background:var(--wn);color:var(--bg)}.acts{display:flex;gap:6px;flex-basis:100%;padding-left:54px}.row input.t{width:112px;flex:none;border:1px solid var(--ln);padding:6px 8px}.row input[data-m]{flex:1;min-width:0}
.tg{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:6px}
.tg.bad{background:var(--bad);color:var(--bg)}.tg.ok{background:var(--ok);color:var(--bg)}
.row button{padding:6px 10px;font-size:14px;white-space:nowrap}
input,select{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 10px}
.row input{border:0;padding:6px 0;background:transparent}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.card small,.hint{color:var(--mut);font-size:13px}
.hint{margin:8px 0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px}
.sum small{display:block;color:var(--mut)}.sum b{font-size:17px}
.in{color:var(--ok)}.out{color:var(--bad)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600;width:100%}
.stu{display:flex;justify-content:space-between;gap:8px}
.stu b{font-size:17px}.pill{font-weight:800}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 6px}.fl small{display:block;color:var(--mut);font-size:12px}.card.r{background:var(--oks)}button.ck.on{background:var(--ok);color:var(--bg);border-color:var(--ok)}.card.c{padding:8px 10px;margin-bottom:6px}.card.c .stu{align-items:center;gap:8px}.card.c .stu b{font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere}.card.c .g3{margin:6px 0 0;gap:6px}.card.c input{padding:5px 8px;font-size:14px}.card.c button,.row.s button{padding:5px 10px;font-size:14px}.card.c .fl small{font-size:11px}.nt{color:var(--mut);font-size:12px;white-space:nowrap}.row.s{min-height:0;padding:6px 10px;margin-bottom:4px}
</style></head><body><div id="authbar" style="max-width:560px;margin:0 auto;padding:14px 14px 0"></div><div id="app"></div>
<script>
const DN=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],HS=[];for(let h=5;h<=23;h++)HS.push(h);
let S={matrix:{},weeks:{},log:{},fin:[],times:{},al:{},dfix:[],paid:{}};
try{const r=localStorage.getItem('agfin');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const cs=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).sort(([a],[b])=>a<b?-1:a>b?1:0)):x);
const DBG={db:null,ready:false,last:{},q:Promise.resolve(),timer:null,st:'local'};
const ST={local:'Salvo só neste aparelho',sync:'Sincronizado na sua conta',busy:'Salvando…',err:'Erro ao sincronizar. Recarregue a página.',login:'Entre com o Google para sincronizar (por enquanto salvo só neste aparelho)',nocfg:'Firebase ainda não configurado. Salvo só neste aparelho.',cfgerr:'Erro no firebase-config.js: confira aspas e vírgulas. Salvo só neste aparelho.'};
function setSt(x){DBG.st=x;const e=document.getElementById('st');if(e)e.textContent=ST[x]}
const save=()=>{try{localStorage.setItem('agfin',JSON.stringify(S))}catch(e){}clearTimeout(DBG.timer);DBG.timer=setTimeout(flush,500)};
function docsOf(){const o={};o['app/core']={matrix:S.matrix,times:S.times,al:S.al,dfix:S.dfix,paid:S.paid};
 for(const k in S.weeks)o['weeks/'+k]=S.weeks[k];
 const lm={};for(const k in S.log){const m=k.slice(0,7);(lm[m]=lm[m]||{})[k]=S.log[k]}
 for(const m in lm)o['logs/'+m]=lm[m];
 for(const q in DBG.last)if(q.startsWith('logs/')&&!o[q])o[q]={};
 return o}
function flush(){if(!DBG.db||!DBG.ready)return;const d=docsOf(),jobs=[];for(const q in d){const j=cs(d[q]);if(DBG.last[q]!==j)jobs.push([q,j])}
 if(!jobs.length)return;setSt('busy');
 DBG.q=DBG.q.then(async()=>{try{for(const [q,j] of jobs){await DBG.db.doc(q).set({j});DBG.last[q]=j}setSt('sync')}catch(e){setSt('err')}})}
const pj=x=>{try{return JSON.parse(x)}catch(e){return null}};
const hasData=(c,nl)=>Object.keys(c.matrix||{}).length||Object.keys(c.al||{}).length||(c.dfix||[]).length||Object.keys(c.paid||{}).length||Object.keys(c.times||{}).length||nl>0;
function syncLast(){const d=docsOf();for(const q in d)DBG.last[q]=cs(d[q])}
function applyCore(o){S.matrix=o.matrix||{};S.times=o.times||{};S.al=o.al||{};S.dfix=o.dfix||[];S.paid=o.paid||{}}
function applyLogMonth(id,o){for(const k in S.log)if(k.startsWith(id))delete S.log[k];Object.assign(S.log,o||{})}
function rerender(){const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;render()}
async function initDb(db){
 if(!db)return;DBG.db=db;
 try{
  const [c,ws,ls]=await Promise.all([db.doc('app/core').get(),db.collection('weeks').get(),db.collection('logs').get()]);
  const rc=c.exists?(pj(c.data().j)||{}):{},rl={};let n=0;
  ls.docs.forEach(d=>{const o=pj(d.data().j)||{};rl[d.id]=o;n+=Object.keys(o).length});
  const remoteHas=hasData(rc,n),localHas=hasData(S,Object.keys(S.log).length);
  if(remoteHas){
   applyCore(rc);S.log={};for(const m in rl)Object.assign(S.log,rl[m]);
   S.weeks={};ws.docs.forEach(d=>{const o=pj(d.data().j);if(o)S.weeks[d.id]=o});
   try{localStorage.setItem('agfin',JSON.stringify(S))}catch(e){}
   syncLast();ls.docs.forEach(d=>{const q='logs/'+d.id;if(!(q in DBG.last))DBG.last[q]=cs({})});
   rerender();
  }
  DBG.ready=true;
  if(!remoteHas&&localHas)flush();else setSt('sync');
  db.doc('app/core').onSnapshot(sn=>{if(!sn.exists||sn.metadata.hasPendingWrites)return;const o=pj(sn.data().j);if(!o||cs(o)===DBG.last['app/core'])return;applyCore(o);DBG.last['app/core']=cs(docsOf()['app/core']);rerender()},()=>{});
  db.collection('weeks').onSnapshot(qs=>{let ch=0;qs.docChanges().forEach(c2=>{if(c2.type==='removed'||c2.doc.metadata.hasPendingWrites)return;const o=pj(c2.doc.data().j),q='weeks/'+c2.doc.id;if(!o||cs(o)===DBG.last[q])return;S.weeks[c2.doc.id]=o;DBG.last[q]=cs(o);ch=1});if(ch)rerender()},()=>{});
  db.collection('logs').onSnapshot(qs=>{let ch=0;qs.docChanges().forEach(c2=>{if(c2.type==='removed'||c2.doc.metadata.hasPendingWrites)return;const o=pj(c2.doc.data().j),q='logs/'+c2.doc.id;if(!o||cs(o)===DBG.last[q])return;applyLogMonth(c2.doc.id,o);DBG.last[q]=cs(o);ch=1});if(ch)rerender()},()=>{});
 }catch(e){setSt('err')}
}
const p2=n=>String(n).padStart(2,'0'),dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const mon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ym0=dk(new Date()).slice(0,7),tdx=(new Date().getDay()+6)%7;
const shiftM=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1);return dk(d).slice(0,7)};
const mlabel=ym=>new Date(+ym.slice(0,4),+ym.slice(5)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
let V={tab:'ag',sub:'sem',wk:mon(new Date()),day:tdx,mday:0,rk:null,fk:null,mk:null,fs:'r',am:ym0,fm:ym0};
const wdataW=w=>{const k=dk(w);if(!S.weeks[k]){const o={};for(let d=0;d<7;d++){const T=dtimes(d);HS.forEach(h=>{const n=S.matrix[d+'|'+h],kk=dk(addD(w,d))+'|'+h;if(n)o[kk]=n;o['t'+kk]=T[h]})}S.weeks[k]=o;save()}return S.weeks[k]},wdata=()=>wdataW(V.wk);
const fmt=m=>p2(Math.floor(m/60)%24)+':'+p2(m%60),tmin=s=>+s.slice(0,2)*60+ +s.slice(3,5);
function dtimes(d){const r={};let p=null;HS.forEach(h=>{const o=S.times[d+'|'+h],m=o?tmin(o):(p===null?h*60:p+60);r[h]=fmt(m);p=m});return r}
const students=()=>{const s=new Set(Object.values(S.matrix));Object.values(S.log).forEach(l=>s.add(l.name));return [...s].sort()};
const btn=(a,t,x='',c='')=>`<button class="${c}" data-a="${a}" ${x}>${t}</button>`;
const nav=(a,l)=>`<div class="nav">${btn(a,'‹','data-n="-1"')}<b>${l}</b>${btn(a,'›','data-n="1"')}</div>`;
const chips=(sel,a)=>`<div class="days">${DN.map((n,i)=>{const d=addD(V.wk,i);return `<button class="chip ${i===sel?'sel':''} ${dk(d)===dk(new Date())?'td':''}" data-a="${a}" data-n="${i}">${n}<span>${d.getDate()}</span></button>`}).join('')}</div>`;
function slot(d,h){const k=dk(d)+'|'+h,base=wdata()[k]||'',l=S.log[k],t=wdata()['t'+k]||p2(h)+':00';
 if(V.rk===k)return `<div class="row"><time>${t}</time><input id="rn" list="al" placeholder="Nome do aluno" autofocus><datalist id="al">${students().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>${btn('saverep','Salvar',`data-k="${k}"`)}${btn('cancel','✕')}</div>`;
 if(l&&l.type==='rep')return `<div class="row r"><time>${t}</time><div class="n"><span class="tg ok">Reposição</span>${esc(l.name)}</div>${btn('undo','Desfazer',`data-k="${k}"`)}</div>`;
 if(l&&l.type==='done')return `<div class="row r"><time>${t}</time><div class="n"><span class="tg ok">✓ Realizada</span>${esc(l.name)}</div>${btn('undo','Desfazer',`data-k="${k}"`)}</div>`;
 if(l)return `<div class="row ${l.type==='fcom'?'w':'f'}"><time>${t}</time><div class="n"><span class="tg ${l.type==='fcom'?'wn':'bad'}">${l.type==='fcom'?'Falta com aviso':l.type==='fsem'?'Falta sem aviso':'Faltou'}</span>${esc(l.name)}</div>${btn('undo','Desfazer',`data-k="${k}"`)}</div>`;
 if(base&&V.mk===k)return `<div class="row"><time>${t}</time><div class="n">${esc(base)}</div><div class="acts" style="padding-left:0"><input id="md" type="date" value="${dk(d)}" style="flex:1;min-width:0;border:1px solid var(--ln);padding:6px 8px"><input id="mt" type="time" value="${t}" style="width:110px;flex:none;border:1px solid var(--ln);padding:6px 8px"></div><div class="acts" style="padding-left:0">${btn('domove','Mover aula',`data-k="${k}" style="flex:1"`,'pri')}${btn('cancel','✕')}</div></div>`;
 if(base&&V.fk===k)return `<div class="row"><time>${t}</time><div class="n">${esc(base)}</div><div class="acts">${btn('fcom','Com aviso',`data-k="${k}"`)}${btn('fsem','Sem aviso',`data-k="${k}"`)}${btn('cancel','✕')}</div></div>`;
 if(base)return `<div class="row"><time>${t}</time><div class="n">${esc(base)}</div>${btn('done','✓ Check',`data-k="${k}"`)}${btn('falta','Faltou',`data-k="${k}"`)}${btn('mk','Mover',`data-k="${k}"`)}</div>`;
 return `<div class="row free"><time>${t}</time><div class="n">Livre</div>${btn('rep','+ Reposição',`data-k="${k}"`)}</div>`}
function semana(){const a=V.wk,b=addD(a,6),dd0=addD(V.wk,V.day),w0=wdata(),ds0=dk(dd0),ord=[...HS].sort((x,y)=>tmin(w0['t'+ds0+'|'+x]||p2(x)+':00')-tmin(w0['t'+ds0+'|'+y]||p2(y)+':00')),f=d=>d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'});
 return `${nav('wk',f(a)+' – '+f(b))}${btn('today','Ir para hoje','','')}<div style="height:10px"></div>${chips(V.day,'day')}${ord.map(h=>slot(dd0,h)).join('')}`}
function matriz(){const TT=dtimes(V.mday);return `<p class="hint">Preencha as aulas fixas de cada dia. Mude o horário de uma aula (ex.: 09:30) e as seguintes ajustam +1h sozinhas. Cada semana nova é criada a partir daqui.</p>${chips(V.mday,'mday')}${HS.map(h=>`<div class="row"><input class="t" type="time" data-t="${V.mday}|${h}" value="${TT[h]}"><input data-m="${V.mday}|${h}" value="${esc(S.matrix[V.mday+'|'+h]||'')}" placeholder="Aluno">${S.times[V.mday+'|'+h]?btn('treset','auto',`data-k="${V.mday}|${h}"`):''}</div>`).join('')}<p class="hint">Semanas já abertas não mudam sozinhas. Para refletir alterações na semana de hoje:</p>${btn('recreate','Recriar semana atual a partir da matriz')}`}
function mes(){const st={};Object.entries(S.log).filter(([k])=>k.startsWith(V.am)).sort().forEach(([k,l])=>{const s=st[l.name]=st[l.name]||{f:[],r:[],d:0};const dt=k.slice(8,10)+'/'+k.slice(5,7);if(l.type==='done')s.d++;else if(l.type==='rep')s.r.push(dt);else s.f.push(dt+(l.type==='fcom'?' (com aviso)':l.type==='fsem'?' (sem aviso)':''))});
 const ns=Object.keys(st).sort(),F=ns.reduce((a,n)=>a+st[n].f.length,0),R=ns.reduce((a,n)=>a+st[n].r.length,0);
 return `${nav('am',mlabel(V.am))}<div class="sum"><div><small>Faltas</small><b class="out">${F}</b></div><div><small>Reposições</small><b class="in">${R}</b></div><div><small>Alunos</small><b>${ns.length}</b></div></div>${ns.length?ns.map(n=>`<div class="card"><div class="stu"><b>${esc(n)}</b><span class="pill"><span class="in">${st[n].d} ✓</span> · <span class="out">${st[n].f.length} falta(s)</span> · <span class="in">${st[n].r.length} rep.</span></span></div>${st[n].f.length?`<small>Faltas: ${st[n].f.join(', ')}</small><br>`:''}${st[n].r.length?`<small>Reposições: ${st[n].r.join(', ')}</small>`:''}</div>`).join(''):'<p class="hint">Nenhuma falta ou reposição neste mês. Marque na aba Semana.</p>'}`}
const A=n=>S.al[n]||{v:0,dc:0,dia:''},net=n=>Math.max(0,(A(n).v||0)-(A(n).dc||0)),pd=(t,i)=>!!S.paid[V.fm+'|'+t+'|'+i],alist=()=>[...new Set([...students(),...Object.keys(S.al)])].sort();
function tot(){const al=alist();return{rr:al.filter(n=>pd('r',n)).reduce((a,n)=>a+net(n),0),rp:al.reduce((a,n)=>a+net(n),0),dd:S.dfix.filter(x=>pd('d',x.id)).reduce((a,x)=>a+x.v,0),dp:S.dfix.reduce((a,x)=>a+x.v,0)}}
function upd(){const t=tot(),s=(i,v)=>{const e=document.getElementById(i);if(e)e.textContent=v};s('s1',brl(t.rr));s('s2',brl(t.dd));s('s3',brl(t.rr-t.dd));s('sp','Previsto: '+brl(t.rp)+' de receitas · '+brl(t.dp)+' de despesas');document.querySelectorAll('[data-net]').forEach(e=>e.textContent='A receber: '+brl(net(e.dataset.net)))}
function fin(){const m=V.fm,t=tot(),al=alist(),D=[...S.dfix].sort((a,b)=>a.dia-b.dia),ck=(k,on)=>btn('pay',on?'✓ Pago':'✓ Check',`data-k="${k}"`,'ck'+(on?' on':''));
 return `${nav('fm',mlabel(m))}<div class="sum"><div><small>Recebido</small><b class="in" id="s1">${brl(t.rr)}</b></div><div><small>Despesas pagas</small><b class="out" id="s2">${brl(t.dd)}</b></div><div><small>Saldo</small><b id="s3">${brl(t.rr-t.dd)}</b></div></div><small class="hint" id="sp">Previsto: ${brl(t.rp)} de receitas · ${brl(t.dp)} de despesas</small>
 <div class="tabs">${btn('fsub','Receitas','data-k="r"',V.fs==='r'?'on':'')}${btn('fsub','Despesas fixas','data-k="d"',V.fs==='d'?'on':'')}</div>${V.fs==='r'?`${al.length?al.map(n=>{const on=pd('r',n),f=(k,l)=>`<label class="fl"><small>${l}</small><input type="number" inputmode="decimal" data-nm="${esc(n)}" data-f="${k}" value="${A(n)[k]||''}" placeholder="0"></label>`;return `<div class="card c ${on?'r':''}"><div class="stu"><b>${esc(n)}</b><small class="nt" data-net="${esc(n)}">A receber: ${brl(net(n))}</small>${ck(m+'|r|'+esc(n),on)}</div><div class="g3">${f('v','Mensalidade')}${f('dc','Desconto')}${f('dia','Vence dia')}</div></div>`}).join(''):'<p class="hint">Os alunos da Matriz aparecem aqui. Você também pode adicionar abaixo.</p>'}
 <div class="g2"><input id="an" placeholder="Novo aluno">${btn('addal','Adicionar aluno')}</div>`:`${D.length?D.map(x=>{const on=pd('d',x.id);return `<div class="row s ${on?'r':''}"><div class="n">${esc(x.n)}<br><small class="hint">Vence dia ${x.dia}</small></div><b>${brl(x.v)}</b>${ck(m+'|d|'+x.id,on)}${btn('delfix','✕',`data-k="${x.id}"`)}</div>`}).join(''):'<p class="hint">Nenhuma despesa fixa. Adicione abaixo.</p>'}
